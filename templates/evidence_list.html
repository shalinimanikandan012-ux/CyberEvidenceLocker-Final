<!DOCTYPE html>
<html>
<head>
    <title>Evidence List</title>
</head>
<body>

<h2>Evidence List</h2>

<table border="1">
    <tr>
        <th>ID</th>
        <th>File Name</th>
        <th>Status</th>
    </tr>

    {% for row in evidence %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[5] }}</td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
