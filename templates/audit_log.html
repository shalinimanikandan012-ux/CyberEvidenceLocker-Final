<!DOCTYPE html>
<html>
<head>
    <title>Audit Log</title>
</head>
<body>

<h2>Audit Log</h2>

<table border="1">
<tr>
    <th>ID</th>
    <th>Action</th>
    <th>User</th>
    <th>Time</th>
</tr>

{% for row in logs %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
